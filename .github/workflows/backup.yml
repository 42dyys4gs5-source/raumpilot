# Daily logical backup (in addition to the database provider's own backups).
# Requires secrets: DATABASE_URL (read-only user recommended), BACKUP_PASSPHRASE, APP_URL, CRON_SECRET.
# The encrypted dump is stored as a workflow artifact for 30 days. For longer retention, upload to your own storage.
name: Database backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    steps:
      # pg_dump must be at least the server's major version (Supabase runs PostgreSQL 17).
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          FILE="raumvia-$(date -u +%Y%m%dT%H%M%SZ).dump"
          pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" -f "$FILE"
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" "$FILE"
          echo "FILE=$FILE.gpg" >> $GITHUB_ENV
          echo "SIZE=$(stat -c%s "$FILE.gpg")" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with: { name: db-backup, path: "${{ env.FILE }}", retention-days: 30 }
      - name: Report to Raumvia
        if: always()
        run: |
          OK=$([ "${{ job.status }}" = "success" ] && echo true || echo false)
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" -H "Content-Type: application/json" \
            -d "{\"ok\": $OK, \"size\": ${SIZE:-0}, \"file\": \"${FILE:-}\"}" "${{ secrets.APP_URL }}/api/cron/backup-report"
