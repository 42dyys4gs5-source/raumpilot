name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: raumpilot
          POSTGRES_PASSWORD: raumpilot
          POSTGRES_DB: raumpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raumpilot" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://raumpilot:raumpilot@localhost:5432/raumpilot_test
      TEST_DATABASE_URL: postgres://raumpilot:raumpilot@localhost:5432/raumpilot_test
      E2E_DATABASE_URL: postgres://raumpilot:raumpilot@localhost:5432/raumpilot_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Prepare databases
        run: |
          PGPASSWORD=raumpilot psql -h localhost -U raumpilot -d raumpilot_test -c "CREATE EXTENSION IF NOT EXISTS citext; CREATE EXTENSION IF NOT EXISTS btree_gist; CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          PGPASSWORD=raumpilot psql -h localhost -U raumpilot -d raumpilot_test -c "CREATE DATABASE raumpilot_e2e"
          PGPASSWORD=raumpilot psql -h localhost -U raumpilot -d raumpilot_e2e -c "CREATE EXTENSION IF NOT EXISTS citext; CREATE EXTENSION IF NOT EXISTS btree_gist; CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
